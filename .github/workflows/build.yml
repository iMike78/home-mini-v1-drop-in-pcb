name: Build and Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ESPHome
        run: |
          pip install esphome==2026.7.0

      - name: Build Factory Firmware
        run: |
          esphome compile esphome/micimike-factory.yml
          mkdir -p release
          cp esphome/.esphome/build/micimike/build/firmware.factory.bin release/micimike-factory.bin
          
      - name: Build Full Firmware
        run: |
          esphome compile esphome/micimike-voice.yml

      - name: Prepare Release Files
        run: |
          # Full firmware (from full build)
          # Note: This assumes micimike-voice.yml uses the same name
          cp esphome/.esphome/build/micimike/build/firmware.ota.bin release/micimike-voice.bin
          cp esphome/.esphome/build/micimike/build/firmware.ota.bin release/micimike-voice-beta.bin
          # Manifests
          cp manifests/manifest.json release/
          cp manifests/manifest-beta.json release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/micimike-factory.bin
            release/micimike-voice.bin
            release/micimike-voice-beta.bin
            release/manifest.json
            release/manifest-beta.json
          body: |
            ## MiciMike Firmware v0.9.8.1

            ### Changes
            - Changed factory dashboard import to the full voice firmware configuration
            - Enabled full configuration import during Home Assistant takeover
            - Preserves BLE Improv Wi-Fi credentials by avoiding wrapper Wi-Fi secrets after takeover
            - Shortened the factory BLE advertising name to keep BLE Improv discovery reliable
            - Shortened the fallback setup AP SSID to `${name} Setup`
            - Added explicit MPR121 register configuration during boot
            - Added raw I2C access for the MPR121 touch controller
            - Updated the ESPHome minimum version to 2026.7.0
            - Updated factory firmware and release manifests to v0.9.8.1

            ### Factory Firmware
            - Initial setup firmware with BLE Improv
            - Flash via USB first time only

            ### Full Firmware
            - Complete voice assistant functionality
            - Updates are available through Home Assistant or ESPHome

            ### Installation
            1. Flash `micimike-factory.bin` via USB
            2. Use BLE Improv to configure WiFi (touch center button to authorize)
            3. Add the device in Home Assistant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
